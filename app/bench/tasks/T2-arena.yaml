id: T2
name: Top-down arena
version: 1
prompt: |
  Create a top-down arena game in this Godot 4.7 project.

  Requirements:
  - A player that moves in eight directions with WASD or the arrow keys.
  - One enemy type that chases the player.
  - The player has health that decreases when an enemy touches them.
  - A score that increases over time or per enemy defeated, shown on screen.
  - A game over screen when health reaches zero, with a way to restart.

  Make the main scene the one that runs the game, and make sure the project
  runs without script errors.
checks:
  - kind: project_loads
  - kind: no_script_errors
  - kind: runs_clean
    seconds: 10
  - kind: nodes_present
    scene: main.tscn
    # Node2D excluded: it is what the starting template already is.
    any_of: [CharacterBody2D, Area2D, RigidBody2D]
    all_of: [Label]
  - kind: files_present
    patterns: ["*.gd"]
  - kind: text_in_scripts
    any_of: ["health", "Health", "hp"]
  - kind: text_in_scripts
    any_of: ["game over", "GameOver", "game_over", "died", "death"]
